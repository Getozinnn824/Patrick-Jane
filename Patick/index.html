<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste do Polígrafo</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="container">
        <h1> Teste do Polígrafo</h1>
        <p class="subtitulo">Sistema de Investigação Criminal</p>
        <form id="formulario">
            <div id="perguntas"></div>
            <button type="submit">Finalizar Teste</button>
        </form>
        <div id="resultado" aria-live="polite">
            <h2>Resultado da Investigação</h2>
            <p id="quantidade"></p>
            <h3 id="classificacao"></h3>
            <p id="mensagem"></p>
            <p class="aviso">Esta classificação é apenas uma simulação escolar e não comprova culpa ou inocência.</p>
        </div>
    </div>
</body>
</html>
